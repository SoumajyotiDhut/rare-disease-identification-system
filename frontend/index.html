<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0A1219" />

  <!-- Fonts loaded once here instead of per-component @import (faster, no FOUC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet" />

  <title>AI DOC — Rare Disease Assistant</title>
  <meta name="description"
    content="Multimodal AI trained on 36,487 real patient cases across 1,374 rare diseases. Symptom analysis, biomedical image recognition, and late-fusion diagnosis ranking." />

  <!-- Open Graph (Slack, WhatsApp, LinkedIn, Facebook, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="AI DOC — Rare Disease Assistant" />
  <meta property="og:description"
    content="Multimodal AI trained on 36,487 real patient cases across 1,374 rare diseases." />
  <meta property="og:image" content="https://yourdomain.com/og-image.png" />
  <meta property="og:url" content="https://yourdomain.com" />

  <!-- Twitter/X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AI DOC — Rare Disease Assistant" />
  <meta name="twitter:description"
    content="Multimodal AI trained on 36,487 real patient cases across 1,374 rare diseases." />
  <meta name="twitter:image" content="https://yourdomain.com/og-image.png" />

  <!-- Structured data for search engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "AI DOC — Rare Disease Assistant",
    "applicationCategory": "HealthApplication",
    "description": "Multimodal AI trained on 36,487 real patient cases across 1,374 rare diseases. Symptom analysis, biomedical image recognition, and late-fusion diagnosis ranking for research and clinical decision support.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "isAccessibleForFree": true
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
